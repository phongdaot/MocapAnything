
### train_video2pose2rot_multidata_3ds.yaml ###
# 三数据集(zoo1030 + obj1k + mobjaverse)联合训练,no-joint-embed。
# 与 lab run_3ds_align.sh 对齐:mobjaverse 用 blocklist + pose_jumps + raw_position;
# joint embedding 全关(v2p use_joint_embed=false + no_joint_embed 置零 p2r 的 t5)。
name: Video2Pose2Rot 3-dataset training (no joint embed)

runtime:
  device: cuda
  seed: 42
  debug: true

output:
  checkpoint_root: ./checkpoints/video2pose2rot

experiment:
  exp: video2pose2rot_multidata_3ds

model:
  target: models.v2.video2pose2rot.model.Video2Pose2RotModel
  params:
    v2p_cfg:
      target: models.v2.video2pose.model.RefGuidedVideo2PoseModel
      params:
        q_dim: 256
        num_layers: 8
        num_heads: 8
        ref_layers: 4
        img_dim: 1024
        num_joints: 150
        use_graph_ref_outer: false
        use_graph_ref_inner: true
        use_graph_temporal_outer: false
        use_graph_temporal_inner: true
        use_joint_embed: false        # 关 v2p joint embed(no-joint-embed)

    p2r_cfg:
      target: models.v2.pose2rot.model.Pose2RotMemoryRestModel
      params:
        q_dim: 256
        rest_layers: 4
        pose_layers: 4
        memory_layers: 4
        decoder_layers: 8
        num_heads: 8
        joint_embed_dim: 768
        temporal_window: 2
        temporal_dropout: 0.1
        decoder_cond_mode: add
        pose_rest_film: true
        memory_rest_film: true
        decoder_rest_film: true
        pose_use_graph: true
        use_grad_checkpoint: false
        decoder_use_cross_layers: 6

  attention_kwargs:
    seq_len: 32
    selfatt_temporal_layer_flag: []
    selfatt_temporal: true
    crossatt2_temporal: true
    selfatt_slidwindow: 5
    crossatt2_slidwindow: 5

train:
  batch_size: 1
  epochs: 40
  grad_accum_steps: 1
  lr: 0.0001
  max_ckpt: 2
  num_workers_train: 4
  test_every: 1
  pretrain_ckpt: null
  no_joint_embed: true             # p2r: 置零 joint_t5embed(与 lab --ablate_no_t5 一致)

  pose_input:
    pose_source_mode: "mix"
    pose_mix_start_prob: 0.1
    pose_mix_end_prob: 1.0
    pose_mix_warmup_epochs: 20
    pose_mix_schedule: "linear"
    detach_pred_pose_for_rot: true

  loss:
    rot_loss_type: smooth_l1
    vel_loss_type: smooth_l1
    acc_loss_type: smooth_l1
    pose_loss_type: l2
    pose_vel_loss_type: l1

  weight:
    root_wt: 0.1
    fk_wt: 0.0
    vel_wt: 1.0
    acc_wt: 0.0
    rot_wt: 1.0
    pose_wt: 1.0
    pose_vel_wt: 0.0

  vis_every: 999
  weight_decay: 0.0

eval:
  batch_size: 1
  num_workers: 2
  preload_all: false
  best_metric:
    test_set: zoo1030
    split: seen
    name: rot_l1

data:
  seq_len: 32
  mmap: true
  cache_scale: true
  limit_species_debug: []
  preload_all: false

  train_sets:
    - name: zoo1030
      bvh_dir: datasets/zoo1030/bvh
      split_json: datasets/zoo1030/selected_test_split_release.json
      memory_pkl_path: null
    - name: obj1k
      bvh_dir: datasets/obj1k/bvh
      split_json: datasets/obj1k/select_test_obj1k.json
      memory_pkl_path: null
    - name: mobjaverse
      bvh_dir: datasets/mobjaverse/bvh
      split_json: datasets/mobjaverse/selected_test_split_mobjaverse.json
      memory_pkl_path: null
      blocklist: datasets/mobjaverse/mobjaverse_blocklist.txt
      pose_jumps_path: datasets/mobjaverse/mobjaverse_pose_jumps.json
      raw_position: true

  test_sets:
    - name: zoo1030
      bvh_dir: datasets/zoo1030/bvh
      split_json: datasets/zoo1030/selected_test_split_release.json
      splits: ["seen", "rare", "unseen"]
      memory_pkl_path: null
      character_dir: datasets/zoo1030/characters
    - name: obj1k
      bvh_dir: datasets/obj1k/bvh
      split_json: datasets/obj1k/select_test_obj1k.json
      splits: ["seen"]
      memory_pkl_path: null
      character_dir: datasets/obj1k/characters
    - name: mobjaverse
      bvh_dir: datasets/mobjaverse/bvh
      split_json: datasets/mobjaverse/selected_test_split_mobjaverse.json
      splits: ["unseen"]
      memory_pkl_path: null
      character_dir: datasets/mobjaverse/characters
      blocklist: datasets/mobjaverse/mobjaverse_blocklist.txt
      pose_jumps_path: datasets/mobjaverse/mobjaverse_pose_jumps.json
      raw_position: true
